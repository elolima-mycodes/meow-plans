<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowPlans - Acesso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card border-0 shadow-lg rounded-4 auth-card overflow-hidden">
    <div class="card-header bg-pastel-pink text-center py-4 border-0">
      <h3 class="fw-bold mb-1 brand-text"><i class="bi bi-calendar-heart-fill me-2"></i>MeowPlans</h3>
      <p class="small text-muted mb-0">Organize suas tarefas com tranquilidade</p>
    </div>
    
    <div class="card-body p-4">
      <ul class="nav nav-pills nav-justified mb-3" id="authTabs" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" id="tab-login" data-bs-toggle="pill" data-bs-target="#pane-login">Login</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tab-register" data-bs-toggle="pill" data-bs-target="#pane-register">Cadastrar</button>
        </li>
      </ul>

      <div class="tab-content">
        <!-- Login -->
        <div class="tab-pane fade show active" id="pane-login">
          <form id="form-login">
            <div class="mb-3">
              <label class="form-label fw-semibold">E-mail</label>
              <input type="email" class="form-control" id="login-email" required placeholder="seu@email.com">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Senha</label>
              <input type="password" class="form-control" id="login-senha" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-pastel-pink fw-bold w-100 py-2">Entrar</button>
          </form>
        </div>

        <!-- Cadastro -->
        <div class="tab-pane fade" id="pane-register">
          <form id="form-register">
            <div class="mb-3">
              <label class="form-label fw-semibold">Nome Completo</label>
              <input type="text" class="form-control" id="reg-nome" required placeholder="Seu nome">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">E-mail</label>
              <input type="email" class="form-control" id="reg-email" required placeholder="seu@email.com">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Senha</label>
              <input type="password" class="form-control" id="reg-senha" required minlength="8" placeholder="Mínimo 8 caracteres">
            </div>
            <button type="submit" class="btn btn-pastel-purple fw-bold w-100 py-2">Criar Conta</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.1/dist/pocketbase.umd.js"></script>
  <script src="pocketbase-service.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PBService.redirectIfAuth();

      document.getElementById('form-login').onsubmit = async (e) => {
        e.preventDefault();
        try {
          await PBService.login(
            document.getElementById('login-email').value,
            document.getElementById('login-senha').value
          );
          window.location.href = 'calendario.html';
        } catch (err) { alert('Falha ao entrar. Verifique seu e-mail e senha.'); }
      };

      document.getElementById('form-register').onsubmit = async (e) => {
        e.preventDefault();
        try {
          await PBService.register(
            document.getElementById('reg-email').value,
            document.getElementById('reg-senha').value,
            document.getElementById('reg-nome').value
          );
          window.location.href = 'calendario.html';
        } catch (err) { alert('Erro ao cadastrar conta.'); }
      };
    });
  </script>
</body>
</html>
