<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowPlans - Gerenciar Tarefas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Menu Superior Responsivo -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold brand-text" href="#"><i class="bi bi-calendar-heart-fill me-2"></i>MeowPlans</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="calendario.html"><i class="bi bi-calendar3 me-1"></i> Calendário</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active fw-bold text-purple" href="gerenciar.html"><i class="bi bi-list-task me-1"></i> Gerenciar Tarefas</a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <span class="fw-semibold me-2 small d-none d-md-inline" id="user-display"></span>
          <button class="btn btn-outline-danger btn-sm" id="btn-logout"><i class="bi bi-box-arrow-right"></i> Sair</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Container Principal -->
  <div class="container-fluid py-4">
    <!-- Barra de Filtros e Ações -->
    <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
      <div class="row g-2 align-items-center">
        <div class="col-md-3 col-12">
          <input type="text" id="filter-search" class="form-control" placeholder="Buscar tarefa...">
        </div>
        <div class="col-md-2 col-6">
          <select id="filter-categoria" class="form-select">
            <option value="">Todas Categorias</option>
          </select>
        </div>
        <div class="col-md-2 col-6">
          <select id="filter-urgencia" class="form-select">
            <option value="">Todas Urgências</option>
            <option value="baixa">Baixa</option>
            <option value="normal">Normal</option>
            <option value="alta">Alta</option>
            <option value="urgente">Urgente</option>
          </select>
        </div>
        <div class="col-md-2 col-6">
          <select id="filter-status" class="form-select">
            <option value="">Todos Status</option>
            <option value="a_fazer">A Fazer</option>
            <option value="em_progresso">Em Progresso</option>
            <option value="concluida">Concluída</option>
            <option value="atrasada">Atrasada</option>
          </select>
        </div>
        <div class="col-md-3 col-12 d-flex gap-2 justify-content-md-end">
          <button class="btn btn-pastel-green fw-bold w-100" id="btn-nova-tarefa"><i class="bi bi-plus-lg me-1"></i> Nova Tarefa</button>
          <button class="btn btn-outline-purple" data-bs-toggle="modal" data-bs-target="#modalCategoria" title="Categorias"><i class="bi bi-tags-fill"></i></button>
          <button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#modalLixeira" title="Lixeira"><i class="bi bi-trash-fill"></i></button>
        </div>
      </div>
    </div>

    <!-- Lista / Tabela de Tarefas Responsiva -->
    <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Título</th>
              <th>Categoria</th>
              <th>Execução (Para Fazer)</th>
              <th>Entrega (Deadline)</th>
              <th>Urgência</th>
              <th>Status</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody id="lista-tarefas">
            <!-- Renderizado via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL: Nova / Editar Tarefa -->
  <div class="modal fade" id="modalTarefa" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header bg-pastel-pink rounded-top-4 border-0">
          <h5 class="modal-title fw-bold" id="modalTarefaTitle">Nova Tarefa</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="form-tarefa">
            <input type="hidden" id="tarefa-id">
            
            <div class="mb-3">
              <label class="form-label fw-semibold">Título <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="tarefa-titulo" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Descrição</label>
              <textarea class="form-control" id="tarefa-descricao" rows="2"></textarea>
            </div>

            <!-- Regra RN01: Validação de Datas -->
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Data de Execução</label>
                <input type="date" class="form-control" id="tarefa-execucao">
                <div class="form-text">Deixe em branco para salvar na gaveta sem data.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Data de Entrega (Prazo Final)</label>
                <input type="date" class="form-control" id="tarefa-entrega">
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label fw-semibold">Categoria</label>
                <select class="form-select" id="tarefa-categoria"></select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Urgência</label>
                <select class="form-select" id="tarefa-urgencia">
                  <option value="baixa">Baixa</option>
                  <option value="normal" selected>Normal</option>
                  <option value="alta">Alta</option>
                  <option value="urgente">Urgente</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Status</label>
                <select class="form-select" id="tarefa-status">
                  <option value="a_fazer">A Fazer</option>
                  <option value="em_progresso">Em Progresso</option>
                  <option value="concluida">Concluída</option>
                  <option value="atrasada">Atrasada</option>
                </select>
              </div>
            </div>

            <hr>
            <!-- Checklist de Subtarefas -->
            <div class="mb-3">
              <label class="form-label fw-semibold d-flex justify-content-between">
                <span>Checklist / Subtarefas</span>
                <button type="button" class="btn btn-sm btn-outline-primary" id="btn-add-subtarefa"><i class="bi bi-plus"></i> Adicionar Item</button>
              </label>
              <div id="subtarefas-list" class="d-flex flex-column gap-2"></div>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <button type="button" class="btn btn-outline-danger d-none" id="btn-excluir-tarefa"><i class="bi bi-trash"></i> Mover para Lixeira</button>
              <div class="ms-auto d-flex gap-2">
                <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-pastel-pink fw-bold">Salvar Tarefa</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: Gerenciar Categorias -->
  <div class="modal fade" id="modalCategoria" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header bg-pastel-cyan rounded-top-4 border-0">
          <h5 class="modal-title fw-bold">Categorias</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="form-categoria" class="row g-2 mb-3">
            <div class="col-7">
              <input type="text" class="form-control" id="cat-nome" placeholder="Nome da Categoria" required>
            </div>
            <div class="col-3">
              <input type="color" class="form-control form-control-color w-100" id="cat-cor" value="#F4C1F2">
            </div>
            <div class="col-2">
              <button type="submit" class="btn btn-pastel-cyan fw-bold w-100"><i class="bi bi-check-lg"></i></button>
            </div>
          </form>
          <ul class="list-group list-group-flush" id="lista-categorias"></ul>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: Lixeira -->
  <div class="modal fade" id="modalLixeira" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header bg-secondary text-white rounded-top-4 border-0">
          <h5 class="modal-title fw-bold"><i class="bi bi-trash-fill me-2"></i>Lixeira</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <ul class="list-group list-group-flush" id="lista-lixeira"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.1/dist/pocketbase.umd.js"></script>
  <script src="pocketbase-service.js"></script>
  <script src="gerenciar.js"></script>
</body>
</html>
