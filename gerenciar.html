<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meow Plans - Gerenciador Central</title>
  
  <!-- CSS Global do Projeto -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Estilos Específicos da Tela de Gerenciamento (Mobile-First) -->
  <style>
    /* Estilização da Barra Superior / Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
    }

    .user-profile-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      background: none;
      border: none;
      cursor: pointer;
    }

    .user-avatar-placeholder {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      border: 2px solid var(--color-primary);
    }

    /* Alternador de Abas (Estilo Capsule Escura da Prototipagem) */
    .segmented-tabs {
      display: flex;
      background-color: #2D3748;
      border-radius: var(--radius-lg);
      padding: 4px;
      margin: 0.5rem 1rem 1rem 1rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.6rem 1rem;
      border: none;
      background: transparent;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition-fast);
      text-align: center;
    }

    .tab-btn.active {
      background-color: #384252;
      color: #FFFFFF;
      box-shadow: inset 0 0 0 2px var(--color-primary);
    }

    /* Barra de Ações (Filtros e Botão de Adição) */
    .action-bar {
      display: flex;
      flex-direction: column;
      padding: 0 1rem;
      margin-bottom: 0.75rem;
      gap: 0.5rem;
    }

    .action-bar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      width: 100%;
    }

    .filters-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      width: 100%;
    }

    .filter-input,
    .filter-btn {
      background-color: #FFFFFF;
      border: 1px solid var(--color-border);
      padding: 0.4rem 0.6rem;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-text-dark);
      outline: none;
    }

    .filter-input {
      flex: 1 1 140px;
    }

    .filter-btn {
      flex: 1 1 100px;
      cursor: pointer;
    }

    .btn-add-action {
      background-color: var(--color-mint-medium);
      color: #125420;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.45rem 1rem;
      border-radius: var(--radius-pill);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
    }

    /* Painel Lilás Principal (Moldura da Lista) */
    .main-lilac-card {
      background-color: #C2BEF6;
      border-radius: var(--radius-xl);
      padding: 1.25rem 1rem 3.5rem 1rem;
      margin: 0 1rem 1rem 1rem;
      min-height: 420px;
      position: relative;
      box-shadow: var(--shadow-md);
    }

    /* Modificação da Lixeira no Card Principal */
    .trash-mode-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #2D3748;
      color: #FFFFFF;
      padding: 0.6rem 1rem;
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
    }

    /* Cards de Tarefa na Lista */
    .task-item-card {
      background: #FFFFFF;
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 8px solid var(--color-primary);
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .task-item-info {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      flex: 1;
    }

    .task-item-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--color-text-dark);
    }

    .task-item-dates {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .task-item-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Cards de Categoria na Lista */
    .category-item-card {
      background: #FFFFFF;
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }

    .category-item-content {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .category-color-badge {
      width: 20px;
      height: 20px;
      border-radius: var(--radius-sm);
    }

    /* Botão Flutuante de Lixeira */
    .btn-lixeira-bottom {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      background-color: #E2E8F0;
      border: 1px solid #CBD5E0;
      padding: 0.4rem 1rem;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--color-text-dark);
      box-shadow: var(--shadow-sm);
    }

    /* Modais */
    .modal-cute-container {
      background-color: #C2BEF6;
      border-radius: var(--radius-xl);
      padding: 1.25rem;
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    .modal-close-icon {
      font-size: 1.25rem;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--color-text-dark);
      font-weight: 700;
    }

    .form-cute-input {
      background-color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      padding: 0.6rem 0.85rem;
      font-size: 0.9rem;
      width: 100%;
    }

    .form-cute-textarea {
      background-color: #A0A0A0;
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      padding: 0.75rem;
      width: 100%;
      min-height: 90px;
      font-size: 0.9rem;
    }

    .subtask-pill-add {
      background-color: #D3D3D3;
      border-radius: var(--radius-pill);
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      margin-top: 0.5rem;
    }

    .subtask-list-inline {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-top: 0.5rem;
      max-height: 120px;
      overflow-y: auto;
    }

    .subtask-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      padding: 0.35rem 0.6rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
    }

    @media (min-width: 768px) {
      .app-container {
        max-width: 720px;
      }
    }
  </style>
  <!-- PocketBase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.3/dist/pocketbase.umd.js"></script>
</head>
<body>

  <div class="app-container">
    <!-- Header Superior -->
    <header class="top-bar">
      <button class="btn btn-outline" style="padding: 0.35rem 0.85rem; font-size: 0.85rem;" onclick="window.location.href='calendario.html'">
        Calendário
      </button>

      <div class="user-profile-btn" id="user-profile-trigger">
        <div class="user-avatar-placeholder" id="user-avatar">🐱</div>
        <span class="text-muted" style="font-size: 0.75rem;" id="logout-btn">Sair</span>
      </div>
    </header>

    <!-- Alternador de Abas (Minhas Tarefas / Categorias) -->
    <nav class="segmented-tabs" id="tab-navigation">
      <button class="tab-btn active" data-tab="tasks" id="tab-tasks-btn">Tarefas</button>
      <button class="tab-btn" data-tab="categories" id="tab-categories-btn">Categorias</button>
    </nav>

    <!-- Barra de Ações Superior (Filtros Avançados e Botão Adicionar) -->
    <div class="action-bar">
      <div class="action-bar-top">
        <span id="tab-section-title" style="font-weight: 700; font-size: 0.95rem;">Minhas Tarefas</span>
        <button class="btn-add-action" id="btn-open-add-modal">
          <span id="add-btn-icon">⊕</span> <span id="add-btn-label">Adicionar Tarefa</span>
        </button>
      </div>

      <!-- Área de Filtros Combinados (Disponível Apenas na Aba Tarefas) -->
      <div class="filters-container" id="tasks-filters-wrapper">
        <input type="text" class="filter-input" id="search-text-filter" placeholder="🔍 Buscar tarefa...">
        
        <select class="filter-btn" id="category-filter-select">
          <option value="">Categoria: Todas</option>
        </select>

        <select class="filter-btn" id="urgency-filter-select">
          <option value="">Urgência: Todas</option>
          <option value="baixa">Baixa</option>
          <option value="normal">Normal</option>
          <option value="alta">Alta</option>
          <option value="urgente">Urgente</option>
        </select>

        <select class="filter-btn" id="status-filter-select">
          <option value="">Status: Todos</option>
          <option value="a_fazer">A Fazer</option>
          <option value="em_progresso">Em Progresso</option>
          <option value="concluida">Concluída</option>

          <option value="atrasada">Atrasada</option>
          <option value="cancelada">Cancelada</option>
        </select>
      </div>
    </div>

    <!-- Moldura Lilás Principal -->
    <main class="main-lilac-card" id="main-content-card">
      <!-- Cabeçalho Especial de Lixeira -->
      <div id="trash-header" class="trash-mode-header hidden">
        <button class="modal-close-icon" id="btn-close-trash" style="color: #FFF;">✕</button>
        <span style="font-weight: 700;" id="trash-title-label">Lixeira de Tarefas</span>
        <div style="width: 20px;"></div>
      </div>

      <!-- Container da Lista de Tarefas -->
      <div id="tasks-list-container"></div>

      <!-- Container da Lista de Categorias -->
      <div id="categories-list-container" class="hidden"></div>

      <!-- Container de Itens Excluídos (Lixeira) -->
      <div id="trash-list-container" class="hidden"></div>

      <!-- Botão para Acessar a Lixeira -->
      <button class="btn-lixeira-bottom" id="btn-open-trash">Lixeira</button>
    </main>
  </div>

  <!-- MODAL 1: CRIAR / EDITAR TAREFA -->
  <div class="modal-overlay" id="task-modal-overlay">
    <div class="modal-cute-container">
      <div class="flex-between mb-1">
        <button class="modal-close-icon" id="btn-close-task-modal">✕</button>
      </div>

      <form id="task-form">
        <input type="hidden" id="task-id" value="">

        <div class="flex-row mb-1">
          <div style="width: 40%;">
            <select class="form-cute-input" id="task-category-select" required>
              <option value="" disabled selected>■ Categoria</option>
            </select>
          </div>
          <div style="width: 60%;">
            <input type="text" class="form-cute-input" id="task-title-input" placeholder="Título da Tarefa" required>
          </div>
        </div>

        <div class="flex-row mb-1" style="align-items: center;">
          <div style="width: 40%;">
            <select class="form-cute-input" id="task-urgency-select" required>
              <option value="normal">🚩 Urgência</option>
              <option value="baixa">Baixa</option>
              <option value="normal">Normal</option>
              <option value="alta">Alta</option>
              <option value="urgente">Urgente</option>
            </select>
          </div>

          <div class="flex-row" style="gap: 0.35rem; align-items: center; width: 30%;">
            <span style="font-size: 0.8rem; font-weight: 700;">Rotina</span>
            <label class="switch-toggle">
              <input type="checkbox" id="task-routine-toggle">
              <span class="slider"></span>
            </label>
          </div>

          <div style="width: 30%;">
            <select class="form-cute-input" id="task-status-select">
              <option value="a_fazer">A Fazer</option>
              <option value="em_progresso">Fazendo</option>
              <option value="concluida">Concluída</option>
              <option value="cancelada">Cancelada</option>
            </select>
          </div>
        </div>

        <div class="form-group hidden" id="recurrence-freq-group">
          <label class="form-label" style="font-size: 0.8rem;">Frequência da Rotina:</label>
          <select class="form-cute-input" id="task-recurrence-freq">
            <option value="diario">Diário</option>
            <option value="semanal">Semanal</option>
            <option value="mensal">Mensal</option>
            <option value="anual">Anual</option>
          </select>
        </div>

        <div class="flex-row mb-1">
          <div style="width: 50%;">
            <label class="form-label" style="font-size: 0.75rem; margin-bottom: 0.15rem;">Data de Execução:</label>
            <input type="date" class="form-cute-input" id="task-execution-date">
          </div>
          <div style="width: 50%;">
            <label class="form-label" style="font-size: 0.75rem; margin-bottom: 0.15rem;">Data de Entrega:</label>
            <input type="date" class="form-cute-input" id="task-due-date">
          </div>
        </div>

        <div class="mb-1">
          <textarea class="form-cute-textarea" id="task-description-input" placeholder="Descrição da tarefa..."></textarea>
        </div>

        <div class="mb-1">
          <div class="flex-between">
            <span style="font-size: 0.85rem; font-weight: 700;">Subtarefas</span>
            <button type="button" class="subtask-pill-add" id="btn-add-subtask-row">⊕ Adicionar Subtarefa</button>
          </div>
          <div class="subtask-list-inline" id="subtask-items-container"></div>
        </div>

        <div class="text-center" style="margin-top: 1rem;">
          <button type="submit" class="btn-add-action" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 1rem;" id="btn-save-task">
            Adicionar Tarefa
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 2: CRIAR / EDITAR CATEGORIA -->
  <div class="modal-overlay" id="category-modal-overlay">
    <div class="modal-cute-container">
      <div class="flex-between mb-1">
        <button class="modal-close-icon" id="btn-close-category-modal">✕</button>
      </div>

      <form id="category-form">
        <input type="hidden" id="category-id" value="">

        <div class="text-center mb-1">
          <input type="text" class="form-cute-input text-center" id="category-name-input" placeholder="Título da Categoria" style="font-size: 1.1rem; font-weight: 700;" required>
        </div>

        <div class="mb-1">
          <select class="form-cute-input" id="category-color-select" required>
            <option value="#C2BEF6">■ Lilás Pastel</option>
            <option value="#F4C1F2">■ Rosa Pastel</option>
            <option value="#BEF7F3">■ Verde Mint</option>
            <option value="#FFC878">■ Amarelo Pastel</option>
            <option value="#FF8A8A">■ Coral Soft</option>
            <option value="#A0A0A0">■ Cinza Neutro</option>
          </select>
        </div>

        <div class="mb-1">
          <textarea class="form-cute-textarea" id="category-description-input" placeholder="Descrição da categoria (opcional)..."></textarea>
        </div>

        <div class="text-center" style="margin-top: 1.5rem;">
          <button type="submit" class="btn-add-action" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 1rem;" id="btn-save-category">
            Adicionar Categoria
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="gerenciar.js"></script>
</body>
</html>
