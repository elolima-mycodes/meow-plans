<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meow Plans - Gerenciador</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Google Fonts: Quicksand -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Global do Projeto -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* Ajustes Finos para Fidelidade Visual com o Protótipo (Wireframe) */
    .meow-card-container {
      background-color: #B5B0F8;
      border-radius: 28px;
      padding: 1.25rem;
      box-shadow: var(--shadow-md);
      min-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    /* Alternador de Abas Superior */
    .meow-tabs {
      background-color: #313552;
      border-radius: 18px;
      padding: 5px;
      display: flex;
      gap: 5px;
    }

    .meow-tab-btn {
      flex: 1;
      padding: 0.6rem 1rem;
      border-radius: 14px;
      border: none;
      background: transparent;
      color: #A0A5C0;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all var(--transition-fast);
    }

    .meow-tab-btn.active {
      background-color: #23263B;
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* Sub-barra de Ações (Filtro e Adicionar) */
    .meow-action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      margin-bottom: 1rem;
    }

    .btn-meow-action {
      background-color: #D3CFFE;
      border: none;
      color: #2D3748;
      font-weight: 700;
      border-radius: 12px;
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
    }

    .btn-meow-add {
      background-color: #78FF92;
      border: none;
      color: #125420;
      font-weight: 700;
      border-radius: 20px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* Cards Fofos de Tarefas e Categorias */
    .meow-item-card {
      background-color: #FFFFFF;
      border-radius: 18px;
      padding: 0.85rem 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      border: 2px solid transparent;
      transition: transform var(--transition-fast);
    }

    .meow-item-card:hover {
      transform: translateY(-2px);
    }

    .meow-card-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .meow-icon-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #E8E6FC;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .meow-card-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--color-text-dark);
      margin-bottom: 0.1rem;
    }

    .meow-card-dates {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      font-weight: 600;
    }

    .flag-urgency {
      font-size: 1.2rem;
    }

    /* Botão Flutuante/Inferior Lixeira */
    .btn-trash-box {
      background-color: #D3CFFE;
      border: 2px solid #2D3748;
      border-radius: 12px;
      padding: 0.5rem 1.25rem;
      font-weight: 700;
      color: #2D3748;
      margin-top: auto;
      align-self: flex-end;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Modal Customizado Roxo */
    .modal-meow .modal-content {
      background-color: #B5B0F8;
      border-radius: 24px;
      border: none;
      padding: 1rem;
    }

    .modal-meow .modal-header {
      border-bottom: none;
      padding-bottom: 0;
    }

    .modal-meow .btn-close-custom {
      background: none;
      border: none;
      font-size: 1.5rem;
      font-weight: bold;
      color: #2D3748;
      cursor: pointer;
    }

    .meow-form-input {
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 0.6rem 0.8rem;
      font-size: 0.9rem;
      width: 100%;
    }

    .meow-form-textarea {
      background-color: #C4C4C4;
      border: none;
      border-radius: 16px;
      padding: 0.75rem;
      width: 100%;
      min-height: 100px;
    }

    /* Badges de Cores para Categorias */
    .category-color-strip {
      width: 12px;
      height: 36px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Topbar Superior -->
  <header class="container py-3">
    <div class="d-flex justify-content-between align-items-center">
      <a href="calendario.html" class="btn btn-light rounded-pill px-3 py-1 font-bold shadow-sm d-flex align-items-center gap-1">
        <span>🗓️</span> Calendário
      </a>
      <div class="d-flex align-items-center gap-2">
        <div id="user-avatar-container" class="rounded-circle bg-light d-flex align-items-center justify-content-center" style="width: 40px; height: 40px; border: 2px solid var(--color-primary);">
          <span id="user-avatar-initial">🐱</span>
        </div>
        <button id="btn-logout" class="btn btn-sm btn-outline-danger rounded-pill px-3 font-bold">Sair</button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container mb-4">
    <div class="meow-card-container">
      
      <!-- Alternador de Abas (Tarefas / Categorias) -->
      <div class="meow-tabs">
        <button id="tab-btn-tasks" class="meow-tab-btn active" onclick="switchTab('tasks')">Tarefas</button>
        <button id="tab-btn-categories" class="meow-tab-btn" onclick="switchTab('categories')">Categorias</button>
      </div>

      <!-- VISÃO: MINHAS TAREFAS -->
      <section id="view-tasks">
        <div class="meow-action-bar">
          <div class="dropdown">
            <select id="filter-category-task" class="btn-meow-action" onchange="renderTasks()">
              <option value="">Filtro: Todas</option>
            </select>
          </div>
          <button class="btn-meow-add" onclick="openTaskModal()">
            <span>⊕</span> Adicionar Tarefa
          </button>
        </div>

        <!-- Lista Dinâmica de Tarefas -->
        <div id="tasks-list-container">
          <!-- Injetado por JS -->
        </div>
      </section>

      <!-- VISÃO: CATEGORIAS -->
      <section id="view-categories" class="hidden">
        <div class="meow-action-bar">
          <button class="btn-meow-action" disabled>Filtro</button>
          <button class="btn-meow-add" onclick="openCategoryModal()">
            <span>⊕</span> Adicionar Categoria
          </button>
        </div>

        <!-- Lista Dinâmica de Categorias -->
        <div id="categories-list-container">
          <!-- Injetado por JS -->
        </div>
      </section>

      <!-- Botão Lixeira -->
      <button class="btn-trash-box" onclick="openTrashModal()">
        Lixeira 🗑️
      </button>
    </div>
  </main>

  <!-- MODAL: ADICIONAR / EDITAR CATEGORIA -->
  <div class="modal fade modal-meow" id="modalCategory" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="btn-close-custom" data-bs-dismiss="modal">✕</button>
        </div>
        <div class="modal-body">
          <form id="form-category" onsubmit="handleCategorySubmit(event)">
            <input type="hidden" id="category-id">
            
            <div class="text-center mb-3">
              <input type="text" id="category-nome" class="meow-form-input text-center font-bold fs-5" placeholder="Título da Categoria" required>
            </div>

            <div class="mb-3">
              <label class="form-label font-bold text-dark">Cor da Categoria</label>
              <select id="category-cor" class="meow-form-input" required>
                <option value="#F4C1F2">🌸 Rosa Pastel</option>
                <option value="#BEF7F3">🌿 Verde Mint</option>
                <option value="#FFC878">🍊 Amarelo Laranja</option>
                <option value="#C2BEF6">🪻 Lilás Soft</option>
                <option value="#FF8A8A">🌺 Coral Red</option>
              </select>
            </div>

            <div class="mb-3">
              <textarea id="category-descricao" class="meow-form-textarea" placeholder="Descrição..."></textarea>
            </div>

            <div class="text-center mt-4">
              <button type="submit" class="btn-meow-add px-4 py-2 fs-6">Adicionar Categoria</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: ADICIONAR / EDITAR TAREFA -->
  <div class="modal fade modal-meow" id="modalTask" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="btn-close-custom" data-bs-dismiss="modal">✕</button>
        </div>
        <div class="modal-body">
          <form id="form-task" onsubmit="handleTaskSubmit(event)">
            <input type="hidden" id="task-id">

            <!-- Linha Título e Categoria -->
            <div class="row g-2 mb-2">
              <div class="col-5">
                <select id="task-categoria" class="meow-form-input font-bold" required>
                  <option value="">■ Categoria</option>
                </select>
              </div>
              <div class="col-7">
                <input type="text" id="task-titulo" class="meow-form-input font-bold" placeholder="Título" required>
              </div>
            </div>

            <!-- Linha Urgência, Rotina, Status -->
            <div class="row g-2 mb-3 align-items-center">
              <div class="col-4">
                <select id="task-urgencia" class="meow-form-input" required>
                  <option value="baixa">🏳️ Baixa</option>
                  <option value="normal" selected>🟡 Normal</option>
                  <option value="alta">🟠 Alta</option>
                  <option value="urgente">🔴 Urgente</option>
                </select>
              </div>
              <div class="col-4 d-flex align-items-center gap-1">
                <span class="font-bold text-dark text-nowrap" style="font-size:0.8rem">Rotina</span>
                <label class="switch-toggle">
                  <input type="checkbox" id="task-is-recurring" onchange="toggleRecurrenceFreq(this.checked)">
                  <span class="slider"></span>
                </label>
              </div>
              <div class="col-4">
                <select id="task-status" class="meow-form-input">
                  <option value="a_fazer">A Fazer</option>
                  <option value="em_progresso">Em Progresso</option>
                  <option value="concluida">Concluída</option>
                  <option value="cancelada">Cancelada</option>
                </select>
              </div>
            </div>

            <!-- Frequência de Recorrência (Opcional) -->
            <div id="container-recurrence-freq" class="mb-2 hidden">
              <label class="form-label font-bold text-dark">Frequência da Rotina</label>
              <select id="task-recurrence-freq" class="meow-form-input">
                <option value="diario">Diário</option>
                <option value="semanal">Semanal</option>
                <option value="mensal">Mensal</option>
                <option value="anual">Anual</option>
              </select>
            </div>

            <!-- Datas -->
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label font-bold text-dark" style="font-size:0.8rem">Data de Execução:</label>
                <input type="date" id="task-data-execucao" class="meow-form-input" required>
              </div>
              <div class="col-6">
                <label class="form-label font-bold text-dark" style="font-size:0.8rem">Data de Entrega:</label>
                <input type="date" id="task-data-entrega" class="meow-form-input" required>
              </div>
            </div>

            <!-- Descrição -->
            <div class="mb-3">
              <textarea id="task-descricao" class="meow-form-textarea" placeholder="Descrição..."></textarea>
            </div>

            <!-- Subtarefas / Checklist (RN04) -->
            <div class="mb-3">
              <label class="form-label font-bold text-dark">Checklist de Subtarefas</label>
              <div id="subtasks-container" class="d-flex flex-column gap-2 mb-2">
                <!-- Lista temporária de subtarefas -->
              </div>
              <button type="button" class="btn btn-sm btn-light rounded-pill font-bold" onclick="addSubtaskInput()">
                ⊕ Adicionar Subtarefa
              </button>
            </div>

            <div class="text-center mt-4">
              <button type="submit" class="btn-meow-add px-4 py-2 fs-6">Adicionar Tarefa</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: LIXEIRA (SOFT DELETE RESTORE) -->
  <div class="modal fade modal-meow" id="modalTrash" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header d-flex justify-content-between align-items-center">
          <button type="button" class="btn-close-custom" data-bs-dismiss="modal">✕</button>
          <span class="btn-meow-action px-3">Lixeira 🗑️</span>
        </div>
        <div class="modal-body">
          <div id="trash-list-container" class="d-flex flex-column gap-2">
            <!-- Itens apagados entram aqui -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- PocketBase SDK -->
  <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
  <!-- App JS -->
  <script src="gerenciar.js"></script>
</body>
</html>
