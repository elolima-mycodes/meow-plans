<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowPlans - Calendário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Menu Superior Responsivo -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold brand-text" href="#"><i class="bi bi-calendar-heart-fill me-2"></i>MeowPlans</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active fw-bold text-purple" href="calendario.html"><i class="bi bi-calendar3 me-1"></i> Calendário</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="gerenciar.html"><i class="bi bi-list-task me-1"></i> Gerenciar Tarefas</a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <span class="fw-semibold me-2 small d-none d-md-inline" id="user-display"></span>
          <button class="btn btn-outline-danger btn-sm" id="btn-logout"><i class="bi bi-box-arrow-right"></i> Sair</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <div class="container-fluid py-4">
    <div class="row g-3">
      <!-- Gaveta Lateral (Sem Data - UC01 / RN03) -->
      <div class="col-lg-3 col-md-4 col-12">
        <div class="card border-0 shadow-sm rounded-4 drawer-card">
          <div class="card-header bg-pastel-purple text-dark border-0 rounded-top-4 d-flex justify-content-between align-items-center py-2">
            <h6 class="mb-0 fw-bold"><i class="bi bi-inbox-fill me-2"></i>Gaveta (Sem Data)</h6>
            <span class="badge bg-white text-dark rounded-pill" id="drawer-count">0</span>
          </div>
          <div class="card-body p-2" id="external-events">
            <!-- Renderizado via JS -->
          </div>
        </div>
      </div>

      <!-- Calendário -->
      <div class="col-lg-9 col-md-8 col-12">
        <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
          <div id="calendar"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.1/dist/pocketbase.umd.js"></script>
  <script src="pocketbase-service.js"></script>
  <script src="calendario.js"></script>
</body>
</html>
