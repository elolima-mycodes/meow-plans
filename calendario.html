<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Meow Plans - Calendário</title>
  
  <!-- Fontes e CSS Global -->
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  
  <!-- PocketBase SDK (UMD) -->
  <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>

  <style>
    /* Estilos de Extensão Específicos da Tela de Calendário (Tema Escuro & Caixas Pastéis) */
    .calendar-app-wrapper {
      background-color: #2D3748;
      min-height: 100vh;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
    }

    .calendar-header-nav {
      background-color: #232B38;
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .month-nav-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .nav-arrow-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      background: transparent;
      transition: var(--transition-fast);
    }

    .nav-arrow-btn:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    .current-month-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #FFFFFF;
    }

    .user-avatar-badge {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: #E2E8F0;
      border: 2px solid var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-dark);
      font-weight: 700;
      overflow: hidden;
    }

    .user-avatar-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Seletor de Visualização (Abas) */
    .view-selector-tabs {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 0.5rem;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 0.35rem;
      border-radius: var(--radius-pill);
    }

    .tab-btn {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      font-weight: 700;
      color: #A0AEC0;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: center;
      transition: var(--transition-fast);
    }

    .tab-btn.active {
      background-color: #FFFFFF;
      color: var(--color-text-dark);
      box-shadow: var(--shadow-sm);
    }

    /* Visualização Mensal - Grade */
    .month-grid-container {
      padding: 1rem;
    }

    .weekdays-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 700;
      color: #A0AEC0;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.35rem;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 50%;
      cursor: pointer;
      color: #E2E8F0;
      transition: background-color var(--transition-fast);
    }

    .day-cell:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .day-cell.other-month {
      opacity: 0.3;
    }

    .day-cell.selected {
      background-color: var(--color-disabled);
      color: #FFFFFF;
      font-weight: 700;
    }

    .day-cell.today {
      border: 2px solid var(--color-primary);
    }

    /* Painel do Dia Selecionado & Seções Coloridas Fofas */
    .day-details-panel {
      background-color: #232B38;
      border-top-left-radius: var(--radius-xl);
      border-top-right-radius: var(--radius-xl);
      padding: 1.25rem 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .day-panel-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #FFFFFF;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .day-panel-close-btn {
      background: none;
      border: none;
      color: #A0AEC0;
      font-size: 1.25rem;
      cursor: pointer;
    }

    /* Seções pastéis inspiradas na interface do protótipo */
    .task-section-box {
      border-radius: var(--radius-lg);
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .section-pink {
      background-color: #FFEAF8;
      border: 2px solid var(--color-pink-primary);
    }

    .section-mint {
      background-color: #E2FBF9;
      border: 2px solid var(--color-mint-light);
    }

    .section-green {
      background-color: #EBFBEB;
      border: 2px solid var(--color-mint-medium);
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--color-text-dark);
      text-align: center;
      margin-bottom: 0.25rem;
    }

    /* Cards de Tarefa Dentro das Seções */
    .meow-card {
      background-color: #FFFFFF;
      border-radius: var(--radius-md);
      padding: 0.75rem 0.85rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      cursor: pointer;
      position: relative;
    }

    .meow-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .meow-card-title-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-check-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--color-text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .status-check-circle.completed {
      background-color: var(--color-mint-bright);
      border-color: var(--color-mint-bright);
      color: #125420;
    }

    .meow-card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-text-dark);
    }

    .flag-icon {
      font-size: 0.85rem;
    }

    .meow-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--color-text-muted);
      font-weight: 600;
    }

    /* Drag & Drop Feedback Visual */
    .drop-zone-active {
      min-height: 60px;
      border: 2px dashed var(--color-primary);
      border-radius: var(--radius-md);
      background-color: rgba(194, 190, 246, 0.15);
    }

    .card-draggable {
      cursor: grab;
      touch-action: none;
    }

    .card-draggable:active {
      cursor: grabbing;
    }

    /* Responsividade Móbile-First Strict -> Desktop Adapt */
    @media (min-width: 768px) {
      .week-columns-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 0.75rem;
        overflow-x: auto;
      }

      .week-day-column {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
    }

    /* Modal de Tarefa Fofo */
    .modal-cute-container {
      background-color: var(--color-primary-light);
      border-radius: var(--radius-xl);
      padding: 1.25rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>
  <div class="calendar-app-wrapper">
    
    <!-- CABEÇALHO COM LOGO, NAVEGAÇÃO E SELETOR DE VISUALIZAÇÃO -->
    <header class="calendar-header-nav">
      <div class="header-top-bar">
        <div class="month-nav-controls">
          <button class="nav-arrow-btn" id="prevPeriodBtn" aria-label="Anterior">&larr;</button>
          <button class="nav-arrow-btn" id="nextPeriodBtn" aria-label="Próximo">&rarr;</button>
          <span class="current-month-title" id="currentPeriodLabel">Agosto de 2026</span>
        </div>
        
        <div class="flex-row">
          <button class="btn btn-accent btn-sm" id="btnNovaTarefa" style="min-height: 36px; padding: 0 0.75rem; font-size: 0.85rem;">
            + Nova Tarefa
          </button>
          <div class="user-avatar-badge" id="userAvatar" title="Perfil do Usuário">
            <span>🐾</span>
          </div>
        </div>
      </div>

      <!-- Abas de Modos de Visão -->
      <div class="view-selector-tabs">
        <button class="tab-btn" data-view="tarefas" id="btnTabTarefas">Tarefas</button>
        <button class="tab-btn active" data-view="mes" id="btnTabMes">Mês</button>
        <button class="tab-btn" data-view="semana" id="btnTabSemana">Semana</button>
        <button class="tab-btn" data-view="dia" id="btnTabDia">Dia</button>
        <button class="tab-btn" id="btnSair" style="color: var(--color-danger);">Sair</button>
      </div>
    </header>

    <!-- ÁREA PRINCIPAL DE CONTEÚDO DINÂMICO -->
    <main id="calendarMainContent" class="app-container" style="padding: 0; max-width: 100%;">
      <!-- O JS renderizará aqui as visões: Mês, Semana ou Dia -->
    </main>

  </div>

  <!-- MODAL DE CRIAR / EDITAR TAREFA -->
  <div class="modal-overlay" id="taskModalOverlay">
    <div class="modal-card modal-cute-container">
      <div class="modal-header">
        <div class="flex-row">
          <select id="taskCategorySelect" class="select-control" style="width: auto; min-height: 36px; font-size: 0.85rem; padding: 0.25rem 0.5rem; background: var(--color-primary); color: white; font-weight: 700; border: none;">
            <option value="">Sem Categoria</option>
          </select>
        </div>
        <button class="day-panel-close-btn" id="closeTaskModalBtn">&times;</button>
      </div>

      <form id="taskForm" onsubmit="return false;">
        <input type="hidden" id="taskIdInput" />

        <div class="form-group">
          <input type="text" id="taskTitleInput" class="input-control" placeholder="Título da Tarefa (ex: Biologia Exercícios)" required style="font-weight: 700; font-size: 1.1rem;" />
        </div>

        <div class="flex-row mb-1" style="gap: 0.5rem;">
          <select id="taskUrgencySelect" class="select-control" style="flex: 1;">
            <option value="baixa">🚩 Baixa</option>
            <option value="normal" selected>🚩 Normal</option>
            <option value="alta">🚩 Alta</option>
            <option value="urgente">🚩 Urgente</option>
          </select>

          <select id="taskStatusSelect" class="select-control" style="flex: 1;">
            <option value="a_fazer">⦿ A Fazer</option>
            <option value="em_progresso">⏳ Em Progresso</option>
            <option value="concluida">✓ Concluída</option>
            <option value="atrasada">⚠️ Atrasada</option>
            <option value="cancelada">🚫 Cancelada</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">📅 Data de Entrega (Prazo Final):</label>
          <input type="date" id="taskDeliveryDate" class="input-control" required />
        </div>

        <div class="form-group">
          <label class="form-label">📌 Data de Execução (Quando Fazer):</label>
          <input type="date" id="taskExecDate" class="input-control" />
        </div>

        <div class="form-group">
          <label class="custom-checkbox">
            <input type="checkbox" id="taskRecurringCheck" />
            <span class="checkmark"></span>
            <span>É uma Rotina / Tarefa Recorrente?</span>
          </label>
        </div>

        <div class="form-group hidden" id="recurrenceFreqGroup">
          <label class="form-label">🔄 Frequência de Recorrência:</label>
          <select id="taskRecurrenceFreq" class="select-control">
            <option value="diario">Diário</option>
            <option value="semanal" selected>Semanal</option>
            <option value="mensal">Mensal</option>
            <option value="anual">Anual</option>
          </select>
        </div>

        <div class="form-group">
          <textarea id="taskDescInput" class="textarea-control" placeholder="Exercícios, observações ou notas..."></textarea>
        </div>

        <!-- SEÇÃO DE SUBTAREFAS -->
        <div class="form-group" style="background: rgba(255,255,255,0.6); padding: 0.75rem; border-radius: var(--radius-md);">
          <label class="form-label">🐾 Subtarefas</label>
          <div id="subtasksList" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.5rem;">
            <!-- Lista dinâmica de subtarefas -->
          </div>
          <button type="button" class="btn btn-outline btn-block" id="btnAddSubtaskBtn" style="min-height: 36px; font-size: 0.85rem;">
            + Adicionar Subtarefa
          </button>
        </div>

        <div class="flex-between" style="margin-top: 1.25rem; gap: 0.5rem;">
          <button type="button" class="btn btn-danger" id="btnDeleteTask" style="flex: 1; min-height: 40px; font-size: 0.85rem;">
            🗑 Excluir Tarefa
          </button>
          <button type="submit" class="btn btn-secondary" id="btnSaveTask" style="flex: 1; min-height: 40px; font-size: 0.85rem;">
            Salvar Alterações
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="calendario.js"></script>
</body>
</html>
